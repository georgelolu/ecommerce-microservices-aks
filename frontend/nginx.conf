server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /api/products {
        proxy_pass http://product:8000/products;
    }

    location /api/products/ {
        proxy_pass http://product:8000/products/;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
