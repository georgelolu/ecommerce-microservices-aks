
name: E-Commerce Microservices CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  test:
    name: Test ${{ matrix.service }} service
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - product
          - order
          - inventory

    defaults:
      run:
        working-directory: services/${{ matrix.service }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/${{ matrix.service }}/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt pytest httpx

      - name: Run tests
        run: python -m pytest -q

  deploy:
    name: Build, Push and Deploy to AKS
    runs-on: ubuntu-latest
    needs: test

    # Deploy only after tests pass on the main branch.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    env:
      AZURE_ACR_NAME: ${{ vars.AZURE_ACR_NAME }}
      AZURE_ACR_LOGIN_SERVER: ${{ vars.AZURE_ACR_LOGIN_SERVER }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AKS_CLUSTER_NAME: ${{ vars.AKS_CLUSTER_NAME }}
      IMAGE_TAG: ${{ github.sha }}
      NAMESPACE: ecommerce

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Azure using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Sign in to Azure Container Registry
        run: az acr login --name "$AZURE_ACR_NAME"

      - name: Build and push product image
        run: |
          docker build \
            -t "$AZURE_ACR_LOGIN_SERVER/ecommerce-product:$IMAGE_TAG" \
            ./services/product
          docker push "$AZURE_ACR_LOGIN_SERVER/ecommerce-product:$IMAGE_TAG"

      - name: Build and push order image
        run: |
          docker build \
            -t "$AZURE_ACR_LOGIN_SERVER/ecommerce-order:$IMAGE_TAG" \
            ./services/order
          docker push "$AZURE_ACR_LOGIN_SERVER/ecommerce-order:$IMAGE_TAG"

      - name: Build and push inventory image
        run: |
          docker build \
            -t "$AZURE_ACR_LOGIN_SERVER/ecommerce-inventory:$IMAGE_TAG" \
            ./services/inventory
          docker push "$AZURE_ACR_LOGIN_SERVER/ecommerce-inventory:$IMAGE_TAG"

      - name: Build and push frontend image
        run: |
          docker build \
            -t "$AZURE_ACR_LOGIN_SERVER/ecommerce-frontend:$IMAGE_TAG" \
            ./frontend
          docker push "$AZURE_ACR_LOGIN_SERVER/ecommerce-frontend:$IMAGE_TAG"

      - name: Install kubectl and kubelogin
        run: az aks install-cli

      - name: Configure AKS access
        run: |
          az aks get-credentials \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AKS_CLUSTER_NAME" \
            --overwrite-existing \
            --format exec

          kubelogin convert-kubeconfig -l azurecli

      - name: Verify deployment permissions
        run: |
          kubectl auth can-i get deployments -n "$NAMESPACE"
          kubectl auth can-i patch deployments -n "$NAMESPACE"
          kubectl auth can-i list pods -n "$NAMESPACE"

          test "$(kubectl auth can-i get deployments -n "$NAMESPACE")" = "yes"
          test "$(kubectl auth can-i patch deployments -n "$NAMESPACE")" = "yes"
          test "$(kubectl auth can-i list pods -n "$NAMESPACE")" = "yes"

      - name: Deploy updated images
        run: |
          kubectl set image deployment/product \
            product="$AZURE_ACR_LOGIN_SERVER/ecommerce-product:$IMAGE_TAG" \
            -n "$NAMESPACE"

          kubectl set image deployment/order \
            order="$AZURE_ACR_LOGIN_SERVER/ecommerce-order:$IMAGE_TAG" \
            -n "$NAMESPACE"

          kubectl set image deployment/inventory \
            inventory="$AZURE_ACR_LOGIN_SERVER/ecommerce-inventory:$IMAGE_TAG" \
            -n "$NAMESPACE"

          kubectl set image deployment/frontend \
            frontend="$AZURE_ACR_LOGIN_SERVER/ecommerce-frontend:$IMAGE_TAG" \
            -n "$NAMESPACE"

      - name: Verify rollout
        run: |
          kubectl rollout status deployment/product \
            -n "$NAMESPACE" --timeout=180s

          kubectl rollout status deployment/order \
            -n "$NAMESPACE" --timeout=180s

          kubectl rollout status deployment/inventory \
            -n "$NAMESPACE" --timeout=180s

          kubectl rollout status deployment/frontend \
            -n "$NAMESPACE" --timeout=180s

      - name: Display deployed resources
        run: |
          kubectl get deployments,pods,services -n "$NAMESPACE"

