name: E-Commerce Microservices CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Test ${{ matrix.service }} service
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - product
          - order
          - inventory

    defaults:
      run:
        working-directory: services/${{ matrix.service }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/${{ matrix.service }}/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt pytest httpx

      - name: Run automated tests
        run: python -m pytest -q

  build-images:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build product image
        run: docker build -t ecommerce-product:${{ github.sha }} ./services/product

      - name: Build order image
        run: docker build -t ecommerce-order:${{ github.sha }} ./services/order

      - name: Build inventory image
        run: docker build -t ecommerce-inventory:${{ github.sha }} ./services/inventory

      - name: Build frontend image
        run: docker build -t ecommerce-frontend:${{ github.sha }} ./frontend
